# Drop-in per la unit istanziata dal template docker-compose@.service.
# Garantisce che .env (API key + directory persistenti) esista PRIMA che
# docker compose legga il progetto: nessun passaggio manuale al primo avvio
# ne' dopo un clone.
[Service]
ExecStartPre=/opt/docker/compose/gpt4free/scripts/bootstrap.sh
