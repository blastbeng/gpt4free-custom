services:
  gpt4free:
    # Immagine upstream "slim": API-only, multi-arch (arm64 verificato sul Pi5).
    # L'aggiornamento e' gestito da /usr/local/bin/manage-docker, che forza il
    # check del digest sul registry e riavvia la unit solo se l'immagine cambia:
    # per questo va referenziata per TAG (non per digest) e con pull_policy
    # if_not_present, come il resto degli stack.
    image: ${G4F_IMAGE:-hlohaus789/g4f:latest-slim}
    pull_policy: if_not_present
    container_name: gpt4free
    # Lifecycle interamente in mano a systemd (docker-compose@.service):
    # il container non deve riavviarsi da solo o il compose non esce mai.
    restart: no
    init: true
    # Nessuna lista statica di provider: l'ordine dei candidati arriva da
    # g4f_ext/health.py, che li misura in background e salva l'esito in
    # data/g4f/autofree_health.json (TTL 6h). Chi smette di funzionare scende
    # in fondo da solo, chi torna a funzionare risale.
    command: ["python3", "-m", "g4f", "--port", "8080", "--no-gui"]
    ports:
      # Solo rete locale: http://blastpi5:1337/v1
      - "${G4F_PORT:-1337}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Il container ascolta SEMPRE su 8080: la porta host arriva da ports:.
      G4F_CONFIG_DIR: /data/g4f
      PYTHONUNBUFFERED: "1"
      # Provider composito registrato da /ext (vedi g4f_ext/): nessun provider
      # scelto a mano, failover automatico con circuit breaker di g4f.
      # Sovrascrivibile da .env per tornare a un provider singolo.
      G4F_PROVIDER: ${G4F_PROVIDER:-AutoFree}
      # Browser esterno (servizio chromium qui sotto) per i provider che
      # richiedono JS/turnstile: g4f si collega via CDP, non ne avvia uno suo.
      # IP letterale, non il nome del servizio: il server HTTP DevTools di
      # Chrome rifiuta con 500 un header Host che non sia un IP (o localhost).
      G4F_BROWSER_HOST: ${G4F_BROWSER_HOST:-172.31.0.10}
      G4F_BROWSER_PORT: ${G4F_BROWSER_PORT:-9222}
      G4F_BROWSER_HEADLESS: "true"
      # sitecustomize.py in /ext registra AutoFree all'avvio dell'interprete.
      PYTHONPATH: /ext
      # glibc crea un'arena per thread: su 8GB condivisi con altri stack la
      # frammentazione e' la prima causa di OOM. Due arene bastano.
      MALLOC_ARENA_MAX: "2"
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # Cookie/HAR/cache: sopravvivono ai restart e non finiscono nell'immagine.
      - ./data/g4f:/data/g4f
      - ./data/generated_media:/app/generated_media
      - ./data/har_and_cookies:/app/har_and_cookies
      # Estensione locale (provider AutoFree): codice nostro, immagine intatta.
      - ./g4f_ext:/ext:ro
    depends_on:
      - chromium
    networks:
      - default
      - browser
    # g4f non espone /health. La probe deve restare locale ed economica:
    # /v1/providers elenca i provider registrati (~40 ms) e passa dal middleware
    # di autenticazione, quindi verifica sia la chiave sia la registrazione di
    # AutoFree: senza AutoFree ogni chat fallirebbe con "Provider not found".
    # /v1/models non e' adatta a una healthcheck: a cache fredda interroga i
    # provider upstream (misurati 9-20 s) e il solo budget della probe puo'
    # superare il timeout, segnando unhealthy un container che risponde.
    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS -m 15 -H "g4f-api-key: $$G4F_API_KEY" http://127.0.0.1:8080/v1/providers | grep -q "AutoFree"'
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 120s
    # RAM del Pi5 e' contesa (altri stack + swap gia' usato): tetto esplicito.
    mem_limit: 1200m
    memswap_limit: 2g
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Chromium headless per i provider di g4f che richiedono un browser vero
  # (turnstile/JS: Cloudflare, DeepInfra, ...). Immagine multi-arch, arm64
  # verificato. Non espone porte: g4f ci parla via CDP sulla rete del progetto.
  chromium:
    image: ${CHROMIUM_IMAGE:-chromedp/headless-shell:latest}
    pull_policy: if_not_present
    container_name: gpt4free-chromium
    restart: no
    init: true
    shm_size: 256m
    # Flag passati a headless-shell: run.sh li accoda ai suoi (lo script termina
    # con "$@"). Sono la difesa vera contro l'OOM misurato il 2026-11-02:
    #   * --disable-gpu: run.sh forza --use-gl=angle --use-angle=swiftshader,
    #     il processo GPU veniva ucciso dal cgroup e i renderer restavano in un
    #     loop di "ContextResult::kTransientFailure" (CPU 180% con 121 renderer);
    #   * --renderer-process-limit: senza tetto ogni tab dei provider apriva un
    #     renderer nuovo (121 vivi, 110 OOM-kill in 28 minuti); Chrome riusa i
    #     processi esistenti invece di crearne altri;
    #   * --js-flags: tetto all'heap V8 di ogni renderer;
    #   * --disable-dev-shm-usage: i 256m di /dev/shm non bastano come area di
    #     scambio dei renderer sotto carico.
    command:
      - --disable-gpu
      - --disable-software-rasterizer
      - --renderer-process-limit=4
      - --js-flags=--max-old-space-size=128
      - --disable-dev-shm-usage
      - --disable-crash-reporter
      - --disable-background-networking
      - --no-first-run
      - --no-default-browser-check
    environment:
      TZ: ${TZ:-Europe/Rome}
    # run.sh dell'immagine: socat TCP4 9222 -> Chromium 127.0.0.1:9223.
    # L'immagine non ha curl/wget, quindi la probe parla HTTP a mano sul
    # /dev/tcp di bash. Non basta la sola connessione TCP: un Chromium saturo
    # (mem_limit raggiunto) accetta il socket e poi non risponde piu', e g4f
    # resta bloccato dentro la sua richiesta CDP bloccando l'intero event loop.
    # Serve quindi una risposta vera dal server DevTools.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/9222 && printf "GET /json/version HTTP/1.1\r\nHost: 127.0.0.1\r\nConnection: close\r\n\r\n" >&3 && read -t 5 -r line <&3 && case "$$line" in "HTTP/1."*" 200"*) exit 0;; *) exit 1;; esac'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # Chromium e' un servizio di supporto e non deve mai essere la ragione per
    # cui l'API viene OOM-killed, ma 640m si sono dimostrati insufficienti: i
    # provider che aprono una tab per tentativo (Cloudflare, ChatGPT, Copilot,
    # Qwen, DeepInfra) arrivano a decine di renderer e il cgroup uccideva
    # headless-shell in pochi minuti, facendo cadere tutto lo stack
    # (--abort-on-container-exit). 1g lascia margine alle tab; i 256m di swap
    # assorbono i picchi senza regalare RAM al browser.
    mem_limit: 1g
    memswap_limit: 1280m
    networks:
      browser:
        ipv4_address: 172.31.0.10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

# Rete dedicata al browser: subnet fissa perche' g4f deve raggiungere Chromium
# tramite IP letterale (vedi G4F_BROWSER_HOST) e non via nome DNS.
networks:
  browser:
    ipam:
      config:
        - subnet: 172.31.0.0/24
